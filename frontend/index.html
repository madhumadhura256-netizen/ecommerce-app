    <!-- Paste these inside your <head> tag in index.html -->

<!-- 1. Viewport — prevents Android from zooming out and breaking layout -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<!-- 2. Theme color — colors the Android status bar to match your app -->
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f0f0d" media="(prefers-color-scheme: dark)" />

<!-- 3. PWA capable — makes it feel like a native app when added to home screen -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
